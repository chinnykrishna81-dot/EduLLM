<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduLLM — Chemical Reactions: 62 Type 2 Questions</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#193452;background:#f0f5fb}body{margin:0}.wrap{max-width:1040px;margin:auto;padding:24px}h1{font-size:29px}.top{background:white;padding:24px;border-radius:18px;margin-bottom:20px}.filters{display:flex;gap:10px;flex-wrap:wrap}select,input{font:inherit;padding:10px;border:1px solid #c7d8e7;border-radius:10px}.q{background:white;border-radius:20px;padding:24px;margin:20px 0;box-shadow:0 4px 20px #19345212}.meta{color:#687e92;font-size:13px}.sq{border:1px solid #dbe6ef;border-radius:12px;padding:16px;margin:13px 0}.opt{display:block;margin:8px 0;padding:10px;border:1px solid #dbe5ee;border-radius:9px;cursor:pointer}.opt:hover{background:#f4f9fc}.btn{background:#1c77ae;color:white;border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.feedback{padding:12px;background:#eff8f1;border-radius:10px;margin-top:10px}.explanation{background:#fff9e9;border:1px solid #f3d59d;border-radius:16px;padding:20px;margin-top:18px}.explanation img{width:100%;height:auto;max-height:600px;object-fit:contain;background:#fff;border-radius:12px}.eq{font-weight:700;color:#225b85}.hidden{display:none}.note{color:#64788a}li{margin:7px 0}
</style></head><body><main class="wrap"><section class="top"><h1>Chemical Reactions and Equations — Type 2</h1><p>62 questions · 248 subquestions · answer first, then review illustrated explanations.</p><div class="filters"><input id="search" placeholder="Search questions or topics"/><select id="topic"><option value="">All topics</option></select><select id="difficulty"><option value="">All levels</option><option>Easy</option><option>Moderate</option><option>Hard</option></select></div></section><div id="questions"></div></main><script src="question_bank_data.js"></script><script>
const bank=window.EDULLM_BANK.questions;const root=document.getElementById('questions');const topics=[...new Set(bank.map(x=>x.topic))].sort();document.getElementById('topic').innerHTML+=[...topics].map(x=>`<option>${esc(x)}</option>`).join('');
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function draw(){let term=document.getElementById('search').value.toLowerCase(),topic=document.getElementById('topic').value,diff=document.getElementById('difficulty').value;let selected=bank.filter(q=>(!term||(q.main_question+' '+q.topic).toLowerCase().includes(term))&&(!topic||q.topic===topic)&&(!diff||q.complexity===diff));root.innerHTML=selected.map(q=>{let id=q.id;return `<article class="q" id="${id}"><div class="meta">${esc(id)} · ${esc(q.topic)} · Pattern ${esc(q.pattern_id)} · ${esc(q.complexity)} · ${q.marks} marks</div><h2>${esc(q.main_question)}</h2><p class="note">Select one answer for each subquestion.</p>${q.subquestions.map((s,i)=>`<section class="sq"><b>(${String.fromCharCode(97+i)}) ${esc(s.question)}</b> <span class="meta">${s.marks} mark</span>${s.options.map(o=>`<label class="opt"><input type="radio" name="${id}_${i}" value="${o.id}"> ${esc(o.id)}. ${esc(o.text)}</label>`).join('')}<div class="feedback hidden" id="f_${id}_${i}"></div></section>`).join('')}<button class="btn" onclick="check('${id}')">Check answers &amp; show explanation</button><div class="explanation hidden" id="e_${id}"><h3>Easy explanation</h3><p>${esc(q.final_explanation.simple_explanation)}</p><img src="${esc(q.explanation_image_ref)}" alt="${esc(q.explanation_image_alt)}" loading="lazy"><ol>${q.final_explanation.step_by_step.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p><strong>Remember:</strong> ${esc(q.final_explanation.memory_tip)}</p></div></article>`}).join('')||'<p>No matching questions.</p>'}
function check(id){let q=bank.find(x=>x.id===id);let missing=q.subquestions.some((s,i)=>!document.querySelector(`input[name="${id}_${i}"]:checked`));if(missing){alert('Please answer every subquestion first.');return}q.subquestions.forEach((s,i)=>{let v=document.querySelector(`input[name="${id}_${i}"]:checked`).value;let f=document.getElementById(`f_${id}_${i}`);f.classList.remove('hidden');f.innerHTML=(v===s.correct_option?'✓ Correct. ':'✗ Correct answer: '+esc(s.correct_option)+'. ')+esc(s.feedback)});document.getElementById('e_'+id).classList.remove('hidden')}
document.getElementById('search').addEventListener('input',draw);document.getElementById('topic').addEventListener('change',draw);document.getElementById('difficulty').addEventListener('change',draw);draw();
</script></body></html>
