<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Chemical reaction overview</title>
  <desc id="desc">Reactants rearrange to form products while atoms are conserved.</desc>
  <rect width="960" height="420" rx="28" fill="#f4f7fb"/>
  <text x="480" y="62" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#14213d">Chemical Reaction</text>
  <rect x="65" y="125" width="300" height="190" rx="24" fill="#dcecff" stroke="#2673c9" stroke-width="3"/>
  <text x="215" y="165" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#174a7e">REACTANTS</text>
  <circle cx="155" cy="230" r="34" fill="#ff8066"/><circle cx="230" cy="230" r="34" fill="#68a7ff"/><circle cx="300" cy="230" r="34" fill="#ff8066"/>
  <path d="M405 220h135" stroke="#34495e" stroke-width="10" stroke-linecap="round"/><path d="m520 190 38 30-38 30" fill="none" stroke="#34495e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="595" y="125" width="300" height="190" rx="24" fill="#e5f7eb" stroke="#218c4f" stroke-width="3"/>
  <text x="745" y="165" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#176638">PRODUCTS</text>
  <g><circle cx="690" cy="220" r="34" fill="#ff8066"/><circle cx="730" cy="245" r="34" fill="#68a7ff"/></g>
  <g><circle cx="790" cy="220" r="34" fill="#ff8066"/><circle cx="830" cy="245" r="34" fill="#ff8066"/></g>
  <text x="480" y="370" text-anchor="middle" font-family="Arial" font-size="21" fill="#34495e">Atoms rearrange; none are created or destroyed.</text>
</svg>
